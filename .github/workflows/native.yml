name: Native builds
on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'native-plugin/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build --no-bundle
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path native-plugin/Cargo.toml
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:build -- --debug --target aarch64 --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - run: npm run ios:build -- --debug --target aarch64-sim --no-sign --ci
