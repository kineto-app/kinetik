name: Boundary
# This repository is public. Every commit — its files, text inside its images, message, author and
# committer — and every pull request title and description is checked for secrets and private
# details before it can merge.
on:
  push:
  pull_request:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOUNDARY_OCR: required
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq tesseract-ocr > /dev/null
      # A base that is all zeros or missing (new branch, force push) checks the whole history.
      - run: node scripts/boundary.mjs --range "$BASE" "$HEAD"

  # Runs the base branch's scanner over the pull request as data, with the maintainers' private
  # rules. Nothing from the pull request is executed, and a finding reports only the rule and place.
  private:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOUNDARY_OCR: required
      BOUNDARY_RULES: ${{ secrets.BOUNDARY_RULES }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin "pull/$NUMBER/head"
      - run: sudo apt-get install -y -qq tesseract-ocr > /dev/null
      - name: Commits, files, images, messages and identities
        run: node scripts/boundary.mjs --range "$BASE" "$HEAD"
      - name: Title and description
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          printf '%s\n\n%s\n' "$TITLE" "$BODY" | node scripts/boundary.mjs -
