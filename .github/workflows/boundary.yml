name: Boundary
# This repository is public. Every commit — its files, text inside its images, message, author and
# committer — and every pull request title and description is checked for secrets and private
# details before it can merge.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOUNDARY_OCR: required
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq tesseract-ocr > /dev/null
      # A base that is all zeros or missing (new branch, force push) checks the whole history.
      - run: node scripts/boundary.mjs --range "$BASE" "$HEAD"
